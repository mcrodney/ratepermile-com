name: Update DOE/EIA diesel price
on:
  schedule:
    - cron: "0 15 * * 2"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/update_diesel.py
      - name: Commit if changed
        run: |
          if [ -n "$(git status --porcelain data/diesel.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
            git add data/diesel.json
            git commit -m "Update weekly DOE/EIA diesel price"
            git push
          else
            echo "No change"
          fi
